<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>KAZUSORA — Status</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0A0A0A;
      color: #F5F5F0;
      font-family: 'Noto Sans JP', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    .stage {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 4vw;
      text-align: center;
      position: relative;
    }

    .bg-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 55vw;
      color: rgba(245, 245, 240, 0.03);
      pointer-events: none;
      line-height: 1;
    }

    .eyebrow {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      letter-spacing: 0.35em;
      font-size: clamp(0.7rem, 1.5vw, 1rem);
      color: #FFE14D;
      text-transform: uppercase;
    }

    .dot {
      display: inline-block;
      width: 0.6em;
      height: 0.6em;
      border-radius: 50%;
      background: #B8FF3C;
      margin-right: 0.6em;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    #message {
      font-size: clamp(2rem, 7vw, 6.5rem);
      font-weight: 700;
      line-height: 1.35;
      max-width: 90vw;
    }

    #clock {
      font-family: 'Syne', sans-serif;
      font-weight: 400;
      font-size: clamp(1rem, 2.5vw, 1.8rem);
      letter-spacing: 0.15em;
      color: rgba(245, 245, 240, 0.55);
      font-variant-numeric: tabular-nums;
    }

    .hint {
      position: absolute;
      bottom: max(1.5rem, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: rgba(245, 245, 240, 0.35);
      transition: opacity 1s;
    }

    .hint.hidden { opacity: 0; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="bg-text">KS</div>
    <div class="eyebrow"><span class="dot"></span>Now — Status</div>
    <h1 id="message">かずそらは今ジムに行っています</h1>
    <div id="clock">--:--</div>
    <div class="hint" id="hint">タップでメッセージ切り替え／URL に ?msg=... で自由に設定できます</div>
  </div>

  <script>
    const messages = [
      'かずそらは今ジムに行っています',
      'かずそらは今外出中です',
      'かずそらは今勉強中です',
      'かずそらは今休憩中です',
      'かずそらは今作業に集中しています',
    ];
    let index = 0;

    const messageEl = document.getElementById('message');
    const clockEl = document.getElementById('clock');
    const hintEl = document.getElementById('hint');

    // URL の ?msg=好きな文言 で表示メッセージを指定できる
    const custom = new URLSearchParams(location.search).get('msg');
    if (custom) {
      messageEl.textContent = custom;
      messages.unshift(custom);
    }

    document.getElementById('stage').addEventListener('click', () => {
      index = (index + 1) % messages.length;
      messageEl.textContent = messages[index];
      requestWakeLock();
    });

    function tick() {
      const now = new Date();
      clockEl.textContent =
        String(now.getHours()).padStart(2, '0') + ':' +
        String(now.getMinutes()).padStart(2, '0');
    }
    tick();
    setInterval(tick, 10000);

    // 画面スリープ防止（Safari 16.4+ / 自動ロック「なし」との併用推奨）
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch (e) { /* 非対応・省電力モード時は無視 */ }
    }
    requestWakeLock();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    setTimeout(() => hintEl.classList.add('hidden'), 8000);
  </script>
</body>
</html>
